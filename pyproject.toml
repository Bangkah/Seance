[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seance"
version = "0.1.0"
description = "Ask an abandoned git repository what happened to it, using a local open-weight model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Atha" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7"]

[project.scripts]
seance = "seance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["S310", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src"]
plugins = []

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
